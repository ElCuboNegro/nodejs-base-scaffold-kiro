# Pre-commit configuration for AI Voice Verification Agent
# Enforces Docker-only development with comprehensive quality gates

repos:
  # Standard pre-commit hooks (these work reliably cross-platform)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: node_modules/
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
        exclude: node_modules/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-toml
      - id: check-xml
      - id: debug-statements
      - id: name-tests-test
        args: ['--pytest-test-first']

  # Python code formatting (if we add Python files)
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3
        files: \.py$

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ['--profile', 'black']
        files: \.py$

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: \.py$
        args: ['--max-line-length=80']

  # Security scanning for Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['-r', '.']
        files: \.py$

  # Local hooks that run in Docker containers
  - repo: local
    hooks:
      # Prevent local npm/node usage
      - id: prevent-local-npm
        name: Prevent Local NPM Usage
        entry: powershell
        args:
          [
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            'scripts/validate-docker-only.ps1',
          ]
        language: system
        pass_filenames: false
        always_run: true

      # Docker-based quality checks
      - id: docker-quality-check
        name: Docker Quality Check
        entry: powershell
        args:
          [
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            'scripts/pre-commit-quality.ps1',
          ]
        language: system
        pass_filenames: false
        always_run: true

      # BDD test validation
      - id: bdd-test-validation
        name: BDD Test Validation
        entry: powershell
        args:
          ['-ExecutionPolicy', 'Bypass', '-File', 'scripts/pre-commit-bdd.ps1']
        language: system
        pass_filenames: false
        always_run: true

# Configuration
default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: '3.0.0'

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
